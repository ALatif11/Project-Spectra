# Mirrors ui/theme.py TOKENS (bg, surface2, fg, brand); keep in sync.
[theme]
base = "dark"
backgroundColor = "#0b0c0e"
secondaryBackgroundColor = "#1a1b20"
textColor = "#ecedef"
primaryColor = "#5b8cff"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Matches src/audio.py MAX_UPLOAD_BYTES (25 MiB) so the uploader shows the real limit.
maxUploadSize = 25
